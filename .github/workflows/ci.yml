name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: CLARE Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Checkout shellmetrics
        uses: actions/checkout@v4
        with:
          repository: shellspec/shellmetrics
          ref: b3bfff2af6880443112cdbf2ea449440b30ab9b0
          path: .ci/shellmetrics
          persist-credentials: false

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Install CLARE extension tooling
        run: |
          npm ci
          mkdir -p "$HOME/bin"
          install -m 0755 .ci/shellmetrics/shellmetrics "$HOME/bin/shellmetrics"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Make scripts executable
        run: |
          chmod +x clare/verify-ci.sh clare/verify-local.sh
          chmod +x scripts/*.sh

      - name: CLARE — Verify CI
        run: ./clare/verify-ci.sh

      - name: Shellcheck (scripts quality)
        run: shellcheck --severity=error scripts/*.sh clare/verify-ci.sh clare/verify-local.sh
